# ============================================================================
# 活体记忆系统 - Docker Compose 编排（对齐 2026-08-10 稳定化架构）
# ----------------------------------------------------------------------------
# 架构（单写者 + 数据面/管理面分离）：
#   · lms         数据面（FastAPI :8190）：记忆读写、快照、做梦调度、/health
#   · lms-control 管理面（独立 FastAPI app :8191）：自我配置端口 control.py
#                 （热配置/快照/诊断，写端点需 LMS_CONTROL_TOKEN）
#   · MCP 薄桥 / stack_ctl / lms_backup.sh 仍在宿主机运行（见 docs/DOCKER-DEPLOY.md）
#
# 用法:
#   1. cp .env.docker.example .env  并按需填入 DEEPSEEK_API_KEY / LMS_CONTROL_TOKEN
#   2. docker compose up -d --build
#   3. 数据面:   http://localhost:8190/docs   健康: curl http://localhost:8190/health
#      管理面:   http://127.0.0.1:8191/docs   健康: curl http://127.0.0.1:8191/control/health
#   4. 日志:     docker compose logs -f lms | lms-control
#      停止:     docker compose down
# ============================================================================

name: lms

services:
  # ─────────────────────────── 数据面 :8190 ───────────────────────────
  lms:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-memory-system:latest
    container_name: lms
    ports:
      # 数据面：对外 8190（MCP 薄桥 / 胶水层 / 外部调用方）
      - "8190:8190"
    # 从 .env 读取环境变量（含密钥/算法开关；需先从 .env.docker.example 复制）
    env_file:
      - .env
    environment:
      # 容器内必须监听所有网卡，端口映射才能生效
      LMS_API_HOST: "0.0.0.0"
      LMS_API_PORT: "8190"
      # 重要：.env 中 LMS_SNAPSHOT_DIR 是宿主机路径，容器内必须指回挂载点，
      # 否则快照会写进容器可写层（容器重建即丢失）。此处显式覆盖 env_file。
      LMS_SNAPSHOT_DIR: "/app/snapshots"
    volumes:
      # 快照持久化: 宿主机 ./snapshots <-> 容器 /app/snapshots
      - ./snapshots:/app/snapshots
      # 记忆数据: self_voice/ archive/ control/（data/ 全部）
      - ./data:/app/data
      # 审计日志（audit-*.jsonl / control-audit.jsonl / alerts）
      - ./logs:/app/logs
      # 模型缓存(可选): 挂载 huggingface/modelscope 缓存，避免重复下载预训练模型
      - ./lms_cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8190/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # torch / 嵌入器初始化预热
      retries: 3

  # ─────────────────────────── 管理面 :8191 ───────────────────────────
  # control.py 是独立 FastAPI app（不 import 数据面），同镜像单独容器运行。
  # 默认仅绑定 127.0.0.1（管理面不应暴露公网）；如需远程管理，
  # 将 "127.0.0.1:8191:8191" 改为 "8191:8191" 并配合防火墙/反向代理。
  lms-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-memory-system:latest
    container_name: lms-control
    # 覆盖 Dockerfile 默认 CMD（python -m api.run）：同镜像跑管理面
    command: ["python", "scripts/run_control.py"]
    ports:
      - "127.0.0.1:8191:8191"
    env_file:
      - .env
    environment:
      LMS_CTRL_HOST: "0.0.0.0"
      LMS_CTRL_PORT: "8191"
      # 管理面 → 数据面：容器内走服务名，不走宿主端口
      LMS_CTRL_API_BASE: "http://lms:8190"
      # 同上：快照目录指回挂载点（control 读快照新鲜度做诊断）
      LMS_SNAPSHOT_DIR: "/app/snapshots"
    volumes:
      # 管理面写 data/control/access.jsonl + logs/control-audit.jsonl
      - ./data:/app/data
      - ./logs:/app/logs
      # 快照只读（诊断/快照状态用；快照写入唯一写者仍是 lms 数据面）
      - ./snapshots:/app/snapshots:ro
    depends_on:
      lms:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/control/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --------------------------------------------------------------------------
  # 可选: Redis（当前版本不需要）
  # 活体记忆系统的会话状态为进程内内存（SessionManager），快照为本地文件，
  # 暂不依赖任何外部服务。若未来引入分布式会话或记忆索引，可取消下方注释启用。
  # --------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: lms-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./redis_data:/data

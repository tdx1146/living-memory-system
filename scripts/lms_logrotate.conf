# =============================================================================
# LMS API 日志轮转（T1.10 / P1-7）
# -----------------------------------------------------------------------------
# 检查结论（2026-08-09）：api/server.py 约 :40 处仅 logging.basicConfig(stderr)，
# 无 Python 侧文件 handler；日志文件由 systemd StandardOutput=append 或
# lms_ctl.sh 重定向产生（单文件曾长到 3.8MB 无限增长）→ 需要 logrotate。
#
# 关键设计：
#   * copytruncate —— API 进程持续持有同一 fd（append 模式不随重命名重开文件），
#     轮转时先复制再截断，保证进程继续写新文件（代价：轮转瞬间最多丢失
#     一次 write 缓冲，对运维日志可接受）。若未来 API 侧改用
#     TimedRotatingFileHandler（Python 侧轮转），本配置应移除，避免双重轮转。
#   * size 10M + rotate 5 + gzip（delaycompress 保证最近一份未压缩可 tail）。
#   * su trim.openclaw —— 文件属主为运行用户，root 执行 logrotate 时降权。
#
# 安装方式（二选一）：
#   A) 系统级（root）：cp scripts/lms_logrotate.conf /etc/logrotate.d/lms
#      → 随系统每日 logrotate 运行（路径已是绝对路径）
#   B) 用户级（无 root）：用户 crontab 加
#      */30 * * * * logrotate -s "$LMS_HOME/logs/logrotate.state" \
#                          "$LMS_HOME/scripts/lms_logrotate.conf"
#      （-s 指定独立 state 文件，避免与系统 logrotate 冲突）
# =============================================================================

/vol2/1000/AI专用/living-memory-system-cloud/logs/lms_api.log {
    su trim.openclaw trim.openclaw
    size 10M
    rotate 5
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
}

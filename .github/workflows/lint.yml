# 活体记忆系统 - 代码风格检查
# =============================================================================
# 使用 ruff 对核心源码目录进行静态检查。
#
# 触发条件:
#   - push 到 main 分支
#   - pull request 到 main 分支
#
# 检查范围: core/ runtime/ bridge/ persistence/ api/
# 规则:
#   - 最大行长度: 120
#   - 忽略 E203（与 black 格式化兼容）
#   - 忽略 W503（行尾换行，与 black 兼容）
#
# 说明: 本 workflow 独立于 ci.yml，仅做风格质量门，不影响测试流水线的通过状态。
# =============================================================================

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Style (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ruff
        run: pip install ruff

      - name: 运行 ruff 检查
        run: |
          ruff check \
            --line-length 120 \
            --select E,F,W \
            --extend-ignore E203,W503 \
            core/ runtime/ bridge/ persistence/ api/
